[project]
name = "chatbot-cli"
version = "0.2.0"
description = "命令行聊天机器人：连续对话 + 流式输出，配置由 pydantic-settings 管理"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "ruff>=0.5.0"]

[tool.pytest.ini_options]
# 让 tests/ 里可以直接 import config / llm
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
